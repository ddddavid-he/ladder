[package]
name = "ladder-core"
version = "0.1.0"
edition = "2021"
description = "A proxy manager wrapping Mihomo (clash-meta)"
authors = ["ddddavid"]
license = "MIT"

[[bin]]
name = "ladder-core"
path = "src/main.rs"

[features]
default = []
bundled = []  # embed mihomo binary at compile time via build.rs

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# System paths
directories = "5"

# Unix syscalls (PID check, signals)
nix = { version = "0.29", features = ["process", "signal"] }

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
# Used in build.rs for bundled feature
reqwest = { version = "0.12", features = ["blocking", "json"] }
flate2 = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
