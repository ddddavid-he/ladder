name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'dev/**'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: ladder-core
  WORKSPACE: ladder-core

jobs:
  # ─── Linux builds (musl static) ─────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            artifact: ladder-core-linux-amd64
          - arch: arm64
            target: aarch64-unknown-linux-musl
            artifact: ladder-core-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (external)
        working-directory: ${{ env.WORKSPACE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cross build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/ladder-core ../${{ matrix.artifact }}

      - name: Build (bundled)
        working-directory: ${{ env.WORKSPACE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cross build --release --target ${{ matrix.target }} --features bundled
          cp target/${{ matrix.target }}/release/ladder-core ../ladder-core-bundled-linux-${{ matrix.arch }}

      - name: Upload external artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload bundled artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladder-core-bundled-linux-${{ matrix.arch }}
          path: ladder-core-bundled-linux-${{ matrix.arch }}

  # ─── macOS builds (native) ──────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-apple-darwin
            artifact: ladder-core-macos-amd64
          - arch: arm64
            target: aarch64-apple-darwin
            artifact: ladder-core-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (external)
        working-directory: ${{ env.WORKSPACE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/ladder-core ../${{ matrix.artifact }}

      - name: Build (bundled)
        working-directory: ${{ env.WORKSPACE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --target ${{ matrix.target }} --features bundled
          cp target/${{ matrix.target }}/release/ladder-core ../ladder-core-bundled-macos-${{ matrix.arch }}

      - name: Upload external artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload bundled artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladder-core-bundled-macos-${{ matrix.arch }}
          path: ladder-core-bundled-macos-${{ matrix.arch }}

  # ─── Release ─────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifacts
        run: |
          find dist/ -type f | while read f; do
            mv "$f" dist/$(basename "$f")
          done
          # Remove empty subdirs
          find dist/ -type d -empty -delete

      - name: Copy ladder.sh
        run: cp ladder-core/ladder.sh dist/ladder.sh

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ladder v${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ladder-core-linux-amd64
            dist/ladder-core-linux-arm64
            dist/ladder-core-macos-amd64
            dist/ladder-core-macos-arm64
            dist/ladder-core-bundled-linux-amd64
            dist/ladder-core-bundled-linux-arm64
            dist/ladder-core-bundled-macos-amd64
            dist/ladder-core-bundled-macos-arm64
            dist/ladder.sh
            dist/checksums.txt
